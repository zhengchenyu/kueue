apiVersion: kueue.x-k8s.io/v1alpha1
kind: TestJob
metadata:
  name: sample-testjob
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: user-queue
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
    kueue.x-k8s.io/job-min-parallelism: "2"
spec:
  suspend: true
  parallelism: 10
  completions: 10
  template:
    spec:
      schedulingGates:
      - name: kueue.x-k8s.io/elastic-job
      containers:
      - name: main
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["entrypoint-tester", "hello", "world"]
        resources:
          requests:
            cpu: "1"
            memory: "200Mi"
      restartPolicy: Never
